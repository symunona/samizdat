# Samizdat server config. Copy to config.toml (chmod 0600) and edit.
# The real config.toml is gitignored — never commit secrets.

host = "samizdat.example.com"   # or "<ip>.sslip.io" — CertMagic certs this hostname
data_dir = "/var/lib/samizdat"  # holds app.db + vault/ + certs/
dev = false                     # true = plain HTTP on localhost:8787, no cert

# [server]
# port     = 8765                 # listen port
# apk_path = "dist/samizdat.apk"  # THE location of the self-hosted Android APK, served at
#                                 # /download/samizdat.apk + /api/v1/app/android/version (the
#                                 # in-app updater reads it). This one setting is also what the
#                                 # build writes to: `just build-android` asks the server binary
#                                 # for it (`just _apk-path`), so the two cannot disagree.
#                                 # OPTIONAL — unset means dist/samizdat.apk. A relative value
#                                 # resolves against THIS FILE's directory, not the process cwd,
#                                 # so it means the same thing to a `just` recipe and to the
#                                 # systemd unit. The routes are always registered; before a
#                                 # build exists they answer 404, never the SPA's HTML.

# Paywalled scraping: per-domain login lives in extractors/<domain>/feed.yaml
# (auth block: login_url + form selectors + success/paywall markers). Secrets are
# NOT here — `sam login <domain>` stores them in <data_dir>/credentials.toml (0600),
# and the scraper auto-refreshes an expired session from that file.

# LLM provider — prefer environment variables for keys (ANTHROPIC_API_KEY / OPENAI_API_KEY).
# Under the systemd service these env vars come from a gitignored .env in the repo root
# (loaded via EnvironmentFile in deploy/samizdat.service.tmpl) — a user service does NOT
# source ~/.bashrc, so put keys in .env, not your shell profile.
# [llm]
# provider      = "anthropic"                 # or "openai_compat" (OpenAI cloud / Ollama / LM Studio)
# api_key       = ""                           # or env ANTHROPIC_API_KEY / OPENAI_API_KEY
# base_url      = "http://localhost:11434/v1"  # openai_compat only (Ollama default)
# default_model = "claude-haiku-4-5-20251001"

# Fallback chain: when the primary fails at the TRANSPORT level (connection refused,
# timeout, DNS, or 5xx) the next provider is tried in order. Real API errors (4xx) do
# NOT fall through. Use it to run a local Ollama as primary and fall back to Haiku when
# the box is down. Model names are provider-specific, so a pipeline step that names no
# model gets whichever provider serves it its own `default_model` — never the other's.
# [llm]
# provider      = "openai_compat"
# base_url      = "http://box.your-tailnet.ts.net:11434/v1"   # a tailnet box works the same as
#                                              # localhost — but name it, don't use its IP: the
#                                              # provider id is host:port, so the address here is
#                                              # also what pipeline steps pin, and a rebuilt box
#                                              # gets a new IP.
# default_model = "qwen3:4b-instruct-ctx7k"
#
# [[llm.fallback]]
# provider      = "anthropic"                  # api_key from ANTHROPIC_API_KEY env
# default_model = "claude-haiku-4-5-20251001"
#
# Ollama's default context is 4096 tokens and it TRUNCATES silently — a summarize step
# feeds up to 12k chars, so a stock model never sees the end of a long article. The
# OpenAI-compatible endpoint takes no num_ctx, so bake it into a model variant:
#   printf 'FROM qwen3:4b-instruct\nPARAMETER num_ctx 7168\n' > ctx.Modelfile
#   ollama create qwen3:4b-instruct-ctx7k -f ctx.Modelfile
# Size the context to what stays on the GPU — `ollama ps` prints the split, and the
# first byte that spills to CPU roughly halves throughput. Prefer a non-thinking
# ("instruct") build: a reasoning model spends most of its tokens on hidden thinking.

# How much document an LLM step may send, and how big a reply it may get back. Three
# bands by estimated input tokens: below `chunk_above` one plain call on the step's own
# config; below `big_above` the document is split, summarized chunk by chunk (`map`) and
# folded (`reduce`); above that it goes to `big` in one call, clamped to what that model
# holds. Chunk size is DERIVED from ctx_tokens — there is no separate knob.
#
# ctx_tokens must match what the endpoint actually serves (see the num_ctx note above):
# an oversized prompt does not error, it comes back as a confident answer about whatever
# survived. max_tokens caps the REPLY. Size it to the step's output, not to the document:
# a step returning JSON emits a whole structured object, and a cap that cuts it mid-array
# fails the step outright (the reply's finish_reason is checked, and the error names this
# key). Output tokens bill as generated, so headroom on the cap is free.
# [llm.summarize]
# chunk_above   = 4000
# big_above     = 40000
# max_chunks    = 12                       # more pieces than this → hand the whole doc to `big`
# overlap_runes = 200
# max_tries     = 3                        # per role, before escalating to `big`
#
# [llm.summarize.map]                      # per-chunk pass; a role naming no provider/model
# provider   = "box.your-tailnet.ts.net:11434"   # keeps the step's own routing and changes
# model      = "qwen3:4b-instruct-ctx7k"         # only HOW MUCH is sent
# ctx_tokens = 7168
# max_tokens = 300
#
# [llm.summarize.reduce]                   # the fold; carries the STEP's own prompt, because
# provider   = "box.your-tailnet.ts.net:11434"   # the step's output contract is the point of
# model      = "qwen3:4b-instruct-ctx7k"         # the step. Partials too big escalate to `big`.
# ctx_tokens = 7168
# max_tokens = 600
#
# [llm.summarize.big]                      # the escalation target, and the large band
# provider   = "anthropic"
# model      = "claude-haiku-4-5-20251001"
# ctx_tokens = 200000
# max_tokens = 4096
#
# Per-step overrides. The key is a step kind (`llm_summarize`, `llm_topics`,
# `llm_ai_newsletter`, `llm_321_newsletter`); every unset field inherits the blocks above,
# so a step that wants one different number writes one line, not a whole config.
# [llm.summarize.steps.llm_topics.big]
# max_tokens = 8192                        # llm_topics copies each section VERBATIM, so its
#                                          # reply is roughly the size of its input

# YouTube / podcast ingestion via yt-dlp. A datacenter VPS IP is bot-blocked by
# YouTube, so list residential proxies in `proxies` (e.g. home nodes over Tailscale
# running microsocks) or set `cookies` to an exported cookies.txt.
# `proxies` is an ORDERED POOL, not a preference hint: the server health-checks
# every entry each minute, routes jobs through the first healthy one, and rotates
# to the next when a run trips YouTube's bot wall. Two nodes behind the same
# household share one public IP — check the exit IPs in Settings › YouTube Proxy
# before counting them as two. See docs/youtube-ingest.md.
# [ytdlp]
# path    = "yt-dlp"                       # binary on PATH, or an absolute path
# proxies = [                              # ordered; first healthy one carries jobs
#   "socks5h://node-a.tailnet.ts.net:1080",
#   "socks5h://node-b.tailnet.ts.net:1080",
# ]
# proxy   = "socks5h://100.x.y.z:1080"     # legacy single-valued key; appended to `proxies`
# cookies = "/var/lib/samizdat/yt-cookies.txt"  # optional auth fallback

# Auto-export: one-way mirror of Documents + Annotations to a plain-markdown
# Obsidian vault. Files carrying our frontmatter id are overwritten; foreign
# files are never touched.
# [export]
# enabled     = true
# dir         = "/home/you/vault/samizdat"
# grouping    = "weekly"     # date subfolders: none|daily|weekly|monthly
# image_links = "wikilink"   # ![[<file>]], Obsidian resolves by name (default)
#                            # "relative" → ![alt](../assets/<file>) for plain markdown
