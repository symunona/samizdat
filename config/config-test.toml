# Test config — isolated from dev. Server on port 8766. DB in /tmp.
# Used by: just e2e
data_dir       = "/tmp/samizdat-test"
db_path        = "/tmp/samizdat-test/app.db"
cache_dir      = "/tmp/samizdat-test/cache"
vault_dir      = "/tmp/samizdat-test/vault"
extractors_dir = "/home/symunona/dev/sam/extractors"

[server]
port    = 8766
web_dir = "/home/symunona/dev/sam/app/dist"

# Auto-export mirror — exercised by the smoke test's export-api checks.
[export]
enabled = true
dir     = "/tmp/samizdat-test/export-vault"

# One provider so Settings → LLM Services has a row to assert on. Points at a
# dead local port: the e2e run never completes an LLM call (and must not).
[llm]
provider      = "openai_compat"
base_url      = "http://127.0.0.1:9/v1"
default_model = "test-model"

# The integration harness serves a stub OpenAI-compatible box here (harness.js
# startStubLLM), so the model catalog and the picker have real rows without any
# network or spend. `just e2e` does not start it — that provider then simply
# probes as unreachable, which is itself an assertion in the probe check.
[[llm.fallback]]
provider      = "openai_compat"
base_url      = "http://127.0.0.1:8767/v1"
default_model = "stub-large"
